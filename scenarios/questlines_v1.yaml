# 본실험 라인 풀 v1 (M01~M40) - 실험 상세 설계 1-2, 형식은 부록 B, 작성 규칙은 부록 A. 설정집은 worldbible_v1.
#
# 모델에게는 brief 만 보인다(questline/prompting.py). goals, events, probes, solution 은 검사기와 점검 스크립트만 본다.
#   goals     그 퀘스트가 끝났을 때 이뤄야 할 결과 (hold / dead / met) - 개요가 분명히 요구하는 것만
#   events    플레이어 밖에서 일어나는 일 (죽음, 인물 사이 이동). 이미 일어난 일로 알리면 at: start, 퀘스트 안에서 일어나면 at: end
#   probes    함정 지점 - 소유(custody) 2, 죽음(death) 1
#   solution  모범 풀이 - 퀘스트마다 의뢰인 [인물, 장소] 와 단계 [행동, 인물, 장소, 사물]. scripts/check_lines.py 가 위반 0 을 확인한다
#
# 라인마다 같은 뼈대를 쓴다 - 퀘스트 1 에서 플레이어가 사물 하나를 옮기고, 퀘스트 2 에서 인물 하나가 죽는다(죽으며 지니던 사물을
# 다른 인물에게 남기기도 한다). 나머지 세 퀘스트가 함정 지점이다. 함정 순서(퀘스트 3, 4, 5)는 소유-죽음-소유 13,
# 죽음-소유-소유 13, 소유-소유-죽음 14 로 고르게 섞는다 - 함정 위치가 오류율에 섞여 들지 않게 한다.

- id: M01
  giver: 세드릭 몰
  quests:
    - brief: 린도르에서 재상 세드릭 몰이 왕이 직접 문서를 봉할 수 있도록 재상의 인장을 엘리안 왕에게 맡겨 두고 오라고 한다.
      goals: [{hold: [chancellor_seal, elian]}]
    - brief: 선장 로자 마렌이 풍랑에 목숨을 잃었고, 선원들이 건져 낸 남풍 해도는 여관 주인 미르네가 맡아 두었다는 소식을 붉은 시장에서 듣는다.
      goals: []
    - brief: 소금 해안으로 기사를 보낼 뱃길을 정하도록 남풍 해도를 서리 관문의 하렌드 발크에게 가져다준다.
      goals: [{hold: [south_chart, harend]}]
    - brief: 재상의 인장을 세드릭 몰에게 가져다준다.
      goals: [{hold: [chancellor_seal, cedric]}]
    - brief: 소금 해안 뱃길에 밝은 사람에게 소금 해안에서 철마다 부는 바람과 물때를 묻는다.
      goals: []
  events:
    - {quest: 2, at: start, dead: rosa}
    - {quest: 2, at: start, hold: [south_chart, mirne]}
  probes: {3: custody, 4: custody, 5: death}
  death_answerers: [bento]
  solution:
    - giver: [세드릭 몰, 린도르]
      steps: [[받기, 세드릭 몰, 린도르, 재상의 인장], [전달, 엘리안, 린도르, 재상의 인장]]
    - giver: [벤토 사르, 테살 항]
      steps: [[이동, null, 붉은 시장, null], [대화, 미르네, 붉은 시장, null]]
    - giver: [미르네, 붉은 시장]
      steps: [[받기, 미르네, 붉은 시장, 남풍 해도], [전달, 하렌드 발크, 서리 관문, 남풍 해도]]
    - giver: [미르네, 붉은 시장]
      steps: [[받기, 엘리안, 린도르, 재상의 인장], [전달, 세드릭 몰, 린도르, 재상의 인장]]
    - giver: [하렌드 발크, 서리 관문]
      steps: [[이동, null, 테살 항, null], [대화, 벤토 사르, 테살 항, null]]

- id: M02
  giver: 하렌
  quests:
    - brief: 달빛 나루에서 대장장이 하렌이 관문 대장간에서 쓰도록 별철 망치를 서리 관문의 하렌드 발크에게 내주고 오라고 한다.
      goals: [{hold: [star_hammer, harend]}]
    - brief: 달빛 나루의 약초상 마브가 늙어 숨을 거두며 마브의 약상자를 이웃 대장장이 하렌에게 남긴다. 플레이어는 장례를 돕는다.
      goals: []
    - brief: 서리 관문의 기사들이 화상을 입었다. 마브의 약상자를 서리 관문의 하렌드 발크에게 가져다준다.
      goals: [{hold: [herb_chest, harend]}]
    - brief: 별철 망치를 달빛 나루의 대장장이 하렌에게 가져다준다.
      goals: [{hold: [star_hammer, haren]}]
    - brief: 이스카의 옛 모습을 잘 아는 사람에게 무너지기 전 거리의 모습을 듣는다.
      goals: []
  events:
    - {quest: 2, at: end, dead: mab}
    - {quest: 2, at: end, hold: [herb_chest, haren]}
  probes: {3: custody, 4: custody, 5: death}
  death_answerers: [oren]
  solution:
    - giver: [하렌, 달빛 나루]
      steps: [[받기, 하렌, 달빛 나루, 별철 망치], [전달, 하렌드 발크, 서리 관문, 별철 망치]]
    - giver: [하렌, 달빛 나루]
      steps: [[대화, 마브, 달빛 나루, null], [조사, null, 달빛 나루, null]]
    - giver: [하렌드 발크, 서리 관문]
      steps: [[받기, 하렌, 달빛 나루, 마브의 약상자], [전달, 하렌드 발크, 서리 관문, 마브의 약상자]]
    - giver: [하렌, 달빛 나루]
      steps: [[받기, 하렌드 발크, 서리 관문, 별철 망치], [전달, 하렌, 달빛 나루, 별철 망치]]
    - giver: [하렌, 달빛 나루]
      steps: [[이동, null, 이스카, null], [대화, 오렌 케이, 이스카, null]]

- id: M03
