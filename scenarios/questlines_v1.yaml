  quests:
    - brief: 린도르에서 이졸데 공주가 끊어진 은방울 목걸이를 고치도록 스승 미르나에게 맡겨 두고 오라고 한다.
      goals: [{hold: [silver_necklace, mirna]}]
    - brief: 고요한 숲에서 배교자 갈렌이 늙어 숨을 거두며 갈렌의 기도서를 실피 장로 라에넬에게 남긴다. 플레이어는 숲에서 장례를 지켜본다.
      goals: []
    - brief: 등불 분열 때의 일을 아는 사람에게 분열 때 교단이 무엇을 두고 다투었는지 묻는다.
      goals: []
    - brief: 수도원 서고에 두도록 갈렌의 기도서를 하얀 절벽 수도원의 원장 이렌에게 가져다준다.
      goals: [{hold: [galen_prayerbook, iren]}]
    - brief: 은방울 목걸이를 이졸데 공주에게 가져다준다.
      goals: [{hold: [silver_necklace, isolde]}]
  events:
    - {quest: 2, at: end, dead: galen}
    - {quest: 2, at: end, hold: [galen_prayerbook, laenel]}
  probes: {3: death, 4: custody, 5: custody}
  death_answerers: [tovald]
  solution:
    - giver: [이졸데, 린도르]
      steps: [[받기, 이졸데, 린도르, 은방울 목걸이], [전달, 미르나, 린도르, 은방울 목걸이]]
    - giver: [라에넬, 고요한 숲]
      steps: [[대화, 갈렌, 고요한 숲, null], [조사, null, 고요한 숲, null]]
    - giver: [라에넬, 고요한 숲]
      steps: [[이동, null, 등불 대성소, null], [대화, 토발드, 등불 대성소, null]]
    - giver: [이렌, 하얀 절벽 수도원]
      steps: [[받기, 라에넬, 고요한 숲, 갈렌의 기도서], [전달, 이렌, 하얀 절벽 수도원, 갈렌의 기도서]]
    - giver: [이졸데, 린도르]
      steps: [[받기, 미르나, 린도르, 은방울 목걸이], [전달, 이졸데, 린도르, 은방울 목걸이]]

- id: M04
  giver: 하렌드 발크
  quests:
    - brief: 서리 관문에서 하렌드 발크가 서리 뿔피리를 플레이어에게 맡긴다. 플레이어는 뿔피리를 지닌 채 회색 고원으로 오가며, 그 뒤로도 지니고 다닌다.
      goals: [{hold: [frost_horn, player]}]
    - brief: 바람의 홀에서 오스카르 브란이 숨을 거두었고 서리 뿔잔은 씨족 회의가 새 수장을 뽑을 때까지 린도르의 엘리안 왕에게 맡겼다는 소식을 듣고, 서리 관문의 하렌드 발크에게 알린다.
      goals: [{met: harend}]
    - brief: 장례 날까지 축복을 받도록 서리 뿔잔을 등불 대성소의 대사제 토발드에게 가져가 맡겨 둔다.
      goals: [{hold: [horn_cup, tovald]}]
    - brief: 회색 고원 연맹을 이끄는 가문 사람에게 브란 가문이 연맹을 이끌어 온 내력을 묻는다.
      goals: []
    - brief: 왕궁에 걸어 두도록 서리 뿔피리를 린도르의 엘리안 왕에게 가져다준다.
      goals: [{hold: [frost_horn, elian]}]
  events:
    - {quest: 2, at: start, dead: oskar}
    - {quest: 2, at: start, hold: [horn_cup, elian]}
  probes: {3: custody, 4: death, 5: custody}
  death_answerers: [kayla]
  solution:
    - giver: [하렌드 발크, 서리 관문]
      steps: [[받기, 하렌드 발크, 서리 관문, 서리 뿔피리], [이동, null, 바람의 홀, null]]
    - giver: [하렌드 발크, 서리 관문]
      steps: [[이동, null, 서리 관문, null], [대화, 하렌드 발크, 서리 관문, null]]
    - giver: [토발드, 등불 대성소]
      steps: [[받기, 엘리안, 린도르, 서리 뿔잔], [전달, 토발드, 등불 대성소, 서리 뿔잔]]
    - giver: [엘리안, 린도르]
      steps: [[대화, 카일라 브란, 린도르, null]]
    - giver: [엘리안, 린도르]
      steps: [[이동, null, 린도르, null], [전달, 엘리안, 린도르, 서리 뿔피리]]

