# 단계 0 (설계 잠금) 산출물 - 2026-09-02 동결, 2026-10-12 생성 모델 재동결
# 실험 도중 변경 금지 (변경 시 연구 결정 기록에 남길 것)
# 모델 3종 선정 근거: 3사 가격대 균질로 "같은 체급"을 가격으로 정의한다.
# 2026-10-12 재동결(연구자 결정): 중간 등급(gpt-5.2, claude-sonnet-5, gemini-3.5-flash - 입력 $1.5~2,
#   출력 $9~14 / 백만 토큰)에서 소형 등급(입력 $0.1~0.25, 출력 $0.5~1.5)으로 바꿨다. 본실험 추정 비용이
#   약 $63 에서 약 $5~6.5 로 준다(호출당 실측 약 $0.003, 재생성 포함 약 1,600~2,100호출). 확인 시험(예비 측정 라인 6 × 3종 × C1, runs/questline/trial_small_20261012,
#   $0.053)에서 출력 형식을 지키고 함정 오류가 0% 나 100% 로 쏠리지 않았다. 결과는 저비용 등급 모델의
#   결과로 한정해 보고한다. snapshot 은 2026-10-12 endpoints 조회의 공급사 날짜 판이다.

# 호출 경로: OpenRouter 중계 1곳 경유 (2026-09-01 결정)
# - 모델별 공급 경로를 원 공급사로 고정: 요청에 provider.order = [provider_tag], allow_fallbacks = false
# - 배치 실행 전 endpoints API 조회로 snapshot 동결값과 대조, 다르면 실행 중단
#   (날짜 버전은 endpoints 응답의 이름 문자열에 실려 옴 - 보장된 계약이 아니라서
#    파싱 실패는 오류로 처리하고 조회 응답 원본 JSON을 로그에 보존)
relay:
  provider: openrouter
  base_url: https://openrouter.ai/api/v1
  allow_fallbacks: false

models:
  gpt:
    provider: openai
    family: openai           # 학습 계보 - 상용 LLM 은 회사 (이전 주제 계획서의 판정기 가족 독립 검사에서 쓰던 칸)
    router_slug: openai/gpt-6-luna
    provider_tag: openai      # 경로 고정(provider.order)에 넣을 값
    snapshot: gpt-6-luna-20260922
    price_usd_per_mtok: { input: 0.10, output: 0.50 }   # 정가(캐시 할인 없음) - RQ3 주 비용 지표
    request_extra:
      reasoning: { enabled: false }   # 2026-10-12 실측 reasoning_tokens 0
  claude:
    provider: anthropic
    family: anthropic           # 학습 계보 - 상용 LLM 은 회사 (이전 주제 계획서의 판정기 가족 독립 검사에서 쓰던 칸)
    router_slug: anthropic/claude-haiku-5.5
    provider_tag: anthropic
    snapshot: claude-haiku-5.5-20261007
    price_usd_per_mtok: { input: 0.10, output: 0.50 }   # 정가(캐시 할인 없음) - RQ3 주 비용 지표
    request_extra:
      reasoning: { enabled: false }   # 2026-10-12 실측 reasoning_tokens 0
  gemini:
    provider: google
    family: google           # 학습 계보 - 상용 LLM 은 회사 (이전 주제 계획서의 판정기 가족 독립 검사에서 쓰던 칸)
    router_slug: google/gemini-3.1-flash-lite
    provider_tag: google-ai-studio
    snapshot: gemini-3.1-flash-lite-20260507
    price_usd_per_mtok: { input: 0.25, output: 1.50 }   # 정가(캐시 할인 없음) - RQ3 주 비용 지표
    request_extra:
      reasoning: { enabled: false }   # 2026-10-12 실측 reasoning_tokens 0 (3.5-flash 와 달리 끄기 허용)
# sampling 동결값(이전 주제에서 이어받음) - 전 모델 동일 적용
sampling:
  temperature: 0.7
  top_p: 0.9
  max_tokens: 512
  seed: 42               # 반복 1회째 초안. 반복 r(1부터), 시도 t(초안 0, 재생성 1..k)의 seed 는 42 + 100×(r−1) + t
                         # (questline.run.seed_for). 실제 seed 는 호출 meta 에 남는다

# 공급자별 미지원 파라미터는 어댑터 구현 시 조사해 아래에 기록 (논문 부록 원천)
provider_notes:
  openai: "seed 지원. gpt-6-luna 는 enabled=false 허용(2026-10-12 실측). system_fingerprint 는 OpenRouter 응답에 null 로 옴(2026-09-02 gpt-5.2, gpt-5-nano 실측) - 공급사 버전 식별자는 /generation 조회의 model 날짜 판으로 대신한다. 추론: gpt-5.2 는 enabled=false 허용, gpt-5-nano 는 거부(effort=minimal)"
  anthropic: "seed 미지원 - 공급사 API 자체에 없음(haiku-5.5 endpoints 도 같음, 2026-10-12) (2026-09-01 endpoints supported_parameters, 2026-09-02 실측 호출도 정상 - 무시됨). 추론은 enabled=false 로 끔(sonnet-5, haiku-4.5 실측)"
  google: "seed 지원. 3.1-flash-lite 는 enabled=false 허용(2026-10-12 실측). 2.5 계열 안정판은 날짜 없는 식별자라 snapshot 도 식별자 자체(gemini-2.5-flash-lite 실측), 3.x 계열은 날짜 판이 있다(gemini-3.5-flash-20260519). 추론: 2.5-flash-lite 는 enabled=false 허용, 3.5-flash 는 거부(effort=minimal)"

# 추론(reasoning/thinking) 설정 - 단계 0 동결 항목 (2026-09-02 동결)
# 세 모델 모두 사고 모드가 있다. 켜 두면 max_tokens 512 를 사고에 소진해 본문이 잘리고(실측),
# 모델마다 사고량이 달라 비용/지연 지표가 섞인다. 원칙: "각 모델이 허용하는 최소 추론"으로
# 고정하고 모델별 request_extra 에 적는다. 재동결 3종 실측(2026-10-12, 확인 시험 18호출 모두 reasoning_tokens 0):
#   - gpt-6-luna, claude-haiku-5.5, gemini-3.1-flash-lite: 셋 다 reasoning.enabled=false 허용
#   (이전 동결 3종은 gpt-5.2, claude-sonnet-5 가 enabled=false, gemini-3.5-flash 는 끄기 거부로 effort=minimal 이었다)
# 어댑터가 호출마다 응답의 reasoning_tokens 가 0 인지 대조한다(아니면 strict 모드에서 오류).

# 퀘스트 라인 실험 (실험 상세 설계 단계 0, 2026-10-12 동결).
# 생성 모델 3종, temperature, top_p, 추론 설정, 공급 경로는 위 동결값을 그대로 쓴다. seed 는 42 + 100×(r−1) + t.
# max_tokens 만 따로 둔다 - 퀘스트 라인 JSON 이 512 에서 잘린다(예비 실험 102 출력은 4000 에서 잘림 없음).
# 모델별 price_usd_per_mtok(백만 토큰당 달러, 입력/출력)은 2026-10-13 OpenRouter models API 조회값으로 동결한다(연구자 결정).
# RQ3 의 주 비용은 호출마다 토큰 수 × 이 정가다. 청구액(usage.cost)은 공급사 프롬프트 캐시 때문에 같은 요청도 먼저
# 보낸 조건만 제값을 내므로(예비 측정 gpt C1 첫 호출은 캐시 쓰기 요금, C2, C3 첫 호출은 캐시 읽기 요금과 일치) 보조로만 쓴다.
questline:
  max_tokens: 4000
  max_regen: 2            # C2(검사기 피드백), C3(피드백 없는 재생성)의 재생성 최대 횟수
  cost_cap_usd: 15        # 배치 누계 비용 상한 - 넘으면 멈추고 이어 가기로 재개 (소형 등급 본실험 추정 약 $5~6.5 의 2배 남짓)
